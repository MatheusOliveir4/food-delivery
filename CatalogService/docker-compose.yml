# Pode ser usado sozinho (docker compose up nesta pasta) ou pelo docker-compose.yml da raiz.
services:
  catalog-db:
    image: postgres:16
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5434:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - food-delivery-net

  catalog-service:
    build: .
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://catalog-db:5432/catalog_db
      DB_USERNAME: catalog
      DB_PASSWORD: catalog
    ports:
      - "8083:8083"
    restart: on-failure
    networks:
      - food-delivery-net

volumes:
  catalog_db_data:

networks:
  food-delivery-net:
    name: food-delivery-net
