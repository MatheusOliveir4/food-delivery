services:
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      - "5436:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build: .
    depends_on:
      order-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USERNAME: order
      DB_PASSWORD: order
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://host.docker.internal:8083}
      RESTAURANT_SERVICE_URL: ${RESTAURANT_SERVICE_URL:-http://host.docker.internal:8082}
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-por-uma-bem-grande-e-secreta-123}
    ports:
      - "8084:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  order_db_data:
