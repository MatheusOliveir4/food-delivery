spring:
  datasource:
    url: jdbc:h2:mem:orderdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: true

app:
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
  payments:
    simulator-enabled: ${PAYMENT_SIMULATOR_ENABLED:true}
