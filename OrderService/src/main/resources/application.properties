spring.application.name=orderservice
server.port=8084

spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-bem-grande-e-secreta-123}

app.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8080}
app.services.restaurant-url=${RESTAURANT_SERVICE_URL:http://localhost:8082}

http.client.connect-timeout=${HTTP_CONNECT_TIMEOUT:2s}
http.client.read-timeout=${HTTP_READ_TIMEOUT:5s}

app.payments.simulator-enabled=${PAYMENT_SIMULATOR_ENABLED:true}

logging.pattern.correlation=[%X{correlationId:-}] 
