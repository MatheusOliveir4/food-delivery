spring.application.name=orderservice
server.port=8084

spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true

app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-bem-grande-e-secreta-123}

app.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8083}
app.services.restaurant-url=${RESTAURANT_SERVICE_URL:http://localhost:8082}
app.services.timeout-ms=3000
