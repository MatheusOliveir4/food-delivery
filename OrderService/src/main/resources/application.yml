spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/order_db}
    username: ${DB_USERNAME:order}
    password: ${DB_PASSWORD:order}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-por-uma-bem-grande-e-secreta-123}
  services:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8083}
    restaurant-url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}
  payments:
    simulator-enabled: ${PAYMENT_SIMULATOR_ENABLED:true}

http:
  client:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:2s}
    read-timeout: ${HTTP_READ_TIMEOUT:5s}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
