spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/order_db}
    username: ${DB_USERNAME:order}
    password: ${DB_PASSWORD:order}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Confirmação do broker (ack/nack) e devolução de mensagens sem rota.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: true
      mandatory: true
    listener:
      simple:
        observation-enabled: true
        # Depois das tentativas, a mensagem é rejeitada sem requeue e vai para a DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          # 1 entrega + 2 novas tentativas = 3 tentativas (2s, depois 4s).
          max-retries: ${RABBITMQ_LISTENER_MAX_RETRIES:2}
          initial-interval: ${RABBITMQ_LISTENER_RETRY_INITIAL:2s}
          multiplier: 2
          max-interval: 10s

server:
  port: ${SERVER_PORT:8084}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    rabbit:
      enabled: ${app.messaging.enabled}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-por-uma-bem-grande-e-secreta-123}
  services:
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8083}
    restaurant-url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}
  messaging:
    # true: publica/consome eventos no RabbitMQ. false: só escreve os eventos no log.
    enabled: ${MESSAGING_ENABLED:true}
  payments:
    # Liga /dev/payments/* (aprovar/recusar pagamento à mão). Desligado fora do profile stub.
    simulator-enabled: ${PAYMENT_SIMULATOR_ENABLED:false}

http:
  client:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:2s}
    read-timeout: ${HTTP_READ_TIMEOUT:5s}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
