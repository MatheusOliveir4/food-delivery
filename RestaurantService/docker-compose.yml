# Pode ser usado sozinho (docker compose up nesta pasta) ou pelo docker-compose.yml da raiz.
services:
  restaurant-db:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant_db
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    ports:
      - "5435:5432"
    volumes:
      - restaurant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - food-delivery-net

  restaurant-service:
    build: .
    depends_on:
      restaurant-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://restaurant-db:5432/restaurant_db
      DB_USERNAME: restaurant
      DB_PASSWORD: restaurant
    ports:
      - "8082:8082"
    restart: on-failure
    networks:
      - food-delivery-net

volumes:
  restaurant_db_data:

networks:
  food-delivery-net:
    name: food-delivery-net
