spring.application.name=restaurantservice
server.port=8082

# Banco H2 em memoria (some quando o servico para)
spring.datasource.url=jdbc:h2:mem:restaurantdb
spring.datasource.username=sa
spring.datasource.password=

# JPA cria as tabelas automaticamente a partir das @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console web do banco: http://localhost:8082/h2-console
spring.h2.console.enabled=true
