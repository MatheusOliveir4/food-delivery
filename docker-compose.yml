name: food-delivery

include:
  - user-service/docker-compose.yml
  - RestaurantService/docker-compose.yml
  - CatalogService/docker-compose.yml
  - OrderService/docker-compose.yml
  - PaymentService/docker-compose.yml
  - observability/docker-compose.yml

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - food-delivery-net

volumes:
  rabbitmq_data:

networks:
  food-delivery-net:
    name: food-delivery-net
