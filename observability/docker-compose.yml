# Pode ser usado sozinho (docker compose up nesta pasta) ou pelo docker-compose.yml da raiz.
services:

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: food-delivery-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - food-delivery-net

  grafana:
    image: grafana/grafana:13.3.1
    container_name: food-delivery-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - food-delivery-net

  zipkin:
    image: openzipkin/zipkin:3.6.1
    container_name: food-delivery-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - food-delivery-net

networks:
  food-delivery-net:
    name: food-delivery-net
