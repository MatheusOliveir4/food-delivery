# Pode ser usado sozinho (docker compose up nesta pasta) ou pelo docker-compose.yml da raiz.
services:

  prometheus:
    image: prom/prometheus:latest
    container_name: food-delivery-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - food-delivery-net

  grafana:
    image: grafana/grafana:latest
    container_name: food-delivery-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - food-delivery-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: food-delivery-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - food-delivery-net

networks:
  food-delivery-net:
    name: food-delivery-net
