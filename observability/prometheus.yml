global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: "middleware"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["middleware:8080"]

  - job_name: "user-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: "restaurant-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["restaurant-service:8082"]

  - job_name: "catalog-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["catalog-service:8083"]

  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["order-service:8084"]

  - job_name: "payment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["payment-service:8085"]
