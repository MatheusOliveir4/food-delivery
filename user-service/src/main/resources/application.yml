server:
  port: 8081
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/user_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # Em produção, defina JWT_SECRET (mínimo de 32 caracteres)
    secret: ${JWT_SECRET:troque-esta-chave-por-uma-bem-grande-e-secreta-123}
    expiration-ms: 86400000
  admin:
    name: Administrador
    email: ${ADMIN_EMAIL:admin@fooddelivery.com}
    password: ${ADMIN_PASSWORD:admin12345}

management:
  observations:
    enable:
      spring:
        security: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true
