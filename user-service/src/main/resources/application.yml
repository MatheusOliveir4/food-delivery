server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # Em produção, defina JWT_SECRET (mínimo de 32 caracteres)
    secret: ${JWT_SECRET:troque-esta-chave-por-uma-bem-grande-e-secreta-123}
    expiration-ms: 86400000
  admin:
    name: Administrador
    email: ${ADMIN_EMAIL:admin@fooddelivery.com}
    password: ${ADMIN_PASSWORD:admin12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true
